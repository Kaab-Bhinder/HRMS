<style>
        :root {
            --tilt-x: 0deg;
            --tilt-y: 0deg;
        }

        body {
            background-color: #050c16;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            color: white;
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.6; /* Slight overlay effect for readability */
        }

        /* Artistic Medallion Reveal */
        .medallion-reveal {
            animation: artisticReveal 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            filter: blur(20px);
            transform: scale(0.8) translate(var(--tilt-x), var(--tilt-y));
            transition: transform 0.2s ease-out;
        }

        @keyframes artisticReveal {
            to {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1) translate(var(--tilt-x), var(--tilt-y));
            }
        }

        /* Subtle Shimmer for Wordmark */
        .text-shimmer {
            background: linear-gradient(90deg, #ffffff 0%, #d5e3ff 45%, #ffffff 50%, #d5e3ff 55%, #ffffff 100%);
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: elegantShimmer 6s ease-in-out infinite;
        }

        @keyframes elegantShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 250% center; }
        }

        /* Tagline Letter Spacing Reveal */
        .tagline-reveal {
            opacity: 0;
            letter-spacing: 0em;
            transform: translateY(8px);
            animation: taglineReveal 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 0.5s;
        }

        @keyframes taglineReveal {
            to {
                opacity: 0.9;
                letter-spacing: 0.05em;
                transform: translateY(0);
            }
        }

        /* Slide Transitions */
        .slide-content {
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .slide-content.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Shimmer Loading Bar */
        .progress-container {
            width: 140px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1B4E8A, #C0891C, #1B4E8A);
            background-size: 200% 100%;
            border-radius: 99px;
            animation: barShimmer 3s linear infinite, fillProgress 6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes barShimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        @keyframes fillProgress {
            to { width: 100%; }
        }

        .medallion {
            background: linear-gradient(135deg, #1b4e8a 0%, #00376b 100%);
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }

        .gold-dot {
            fill: #C0891C;
        }
    </style>

<body class="flex flex-col items-center justify-center font-body-md overflow-hidden bg-[#050c16]">

<div class="progress-bar"></div>
</div>
<p class="font-label-md text-[10px] text-white/50 mt-6 tracking-[0.25em] uppercase" id="loading-text">Authenticating...</p>
</footer>
<script>
        // Floating Medallion Logic
        const medallion = document.getElementById('medallion');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / 50;
            const y = (e.clientY - window.innerHeight / 2) / 50;
            document.documentElement.style.setProperty('--tilt-x', `${x}px`);
            document.documentElement.style.setProperty('--tilt-y', `${y}px`);
        });

        // Device Tilt Support
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                const x = e.gamma / 5; // tilt left/right
                const y = e.beta / 5;  // tilt front/back
                document.documentElement.style.setProperty('--tilt-x', `${x}px`);
                document.documentElement.style.setProperty('--tilt-y', `${y}px`);
            });
        }

        // Intro Sequence Logic
        const slides = [
            document.getElementById('slide-1'),
            document.getElementById('slide-2'),
            document.getElementById('slide-3'),
            document.getElementById('final-branding')
        ];
        const loadingText = document.getElementById('loading-text');
        const loadingLabels = [
            "AUTHENTICATING...", 
            "ESTABLISHING SECURE TUNNEL...", 
            "VERIFYING CREDENTIALS...", 
            "READY"
        ];

        let currentSlide = 0;

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                slides[currentSlide].classList.remove('active');
                currentSlide++;
                setTimeout(() => {
                    slides[currentSlide].classList.add('active');
                    if (currentSlide < loadingLabels.length) {
                        loadingText.innerText = loadingLabels[currentSlide];
                    }
                }, 300);
            }
        }

        // Timeline - More spaced out and "premium"
        setTimeout(() => nextSlide(), 1400); // To Slide 2
        setTimeout(() => nextSlide(), 2800); // To Slide 3 (Tagline reveal)
        setTimeout(() => {
            nextSlide(); // To Final Branding
            loadingText.style.opacity = "0.7";
        }, 4400);
    </script>

<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const inputs = document.querySelectorAll('input');

            // Subtle parallax effect on the shader underlay based on mouse move
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 100;
                const moveY = (e.clientY - window.innerHeight / 2) / 100;
                const shader = document.querySelector('webgl-shader');
                if (shader) {
                    shader.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
                }
            });

            // Input focus animations
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.parentElement.classList.add('scale-[1.01]');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.parentElement.classList.remove('scale-[1.01]');
                });
            });

            // Toggle Password Visibility
            const togglePass = document.querySelector('button[type="button"]');
            const passInput = document.getElementById('password');
            togglePass.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                togglePass.querySelector('span').innerText = isPass ? 'visibility_off' : 'visibility';
            });
        });
    </script>

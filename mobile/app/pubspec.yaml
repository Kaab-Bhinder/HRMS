name: wms_mobile
description: "Workforce Management — mobile app for employees (attendance, leave, tasks)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + dependency injection
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage (Keychain / Keystore)
  flutter_secure_storage: ^9.2.4

  # Location (attendance GPS + geofence)
  geolocator: ^13.0.2

  # Typography
  google_fonts: ^6.2.1

  # Motion / micro-interactions
  flutter_animate: ^4.5.2

  # Date & time formatting
  intl: ^0.20.2
  image_picker: ^1.2.3
  google_mlkit_face_detection: ^0.13.1
  camera: ^0.11.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

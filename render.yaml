# Render blueprint for the NestJS API.
#
# The API must run as a long-lived server, not a serverless function: the
# auto-checkout job is an in-process setInterval, and file downloads stream
# through the process. On Render's free plan the instance sleeps after ~15
# minutes idle, which both delays the first request by ~50s AND stops
# auto-checkout from firing — keep it awake with an external ping to /health.
services:
  - type: web
    name: hr-client-api
    runtime: node
    plan: free
    region: singapore # closest to the client (Indonesia)
    rootDir: web-app
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and the build tools (@nestjs/cli, typescript) plus the
    # prisma CLI all live there. Without it the build dies on "nest: not found".
    # These stay on disk for the start command, which needs the prisma CLI to
    # run migrate deploy. Only dist/ and runtime deps are actually served.
    buildCommand: npm install --include=dev && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build --workspace apps/api
    # migrate deploy runs on every boot; it is a no-op once applied.
    startCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # No leading slash — matches the app's own default, so routes land at
      # /api/v1/... exactly as they do locally.
      - key: API_PREFIX
        value: api/v1
      - key: NODE_VERSION
        value: "20"
      # The public address of the WEB app. Every link the system mails or sends
      # over WhatsApp is built from this — invitations, password resets and
      # agreement signing. Without it the code falls back to CORS_ORIGINS, which
      # is a safety net rather than an answer: it picks *an* origin, not
      # necessarily the right one.
      - key: APP_URL
        value: https://hrms-bay-iota.vercel.app
      # Must be on the domain verified with Resend, or every send is rejected.
      # The display name before it is free text.
      - key: MAIL_FROM
        value: Prima HR <no-reply@pwigroup.id>
      # Secrets are set in the Render dashboard, never in this file:
      #   DATABASE_URL          (Neon, include ?sslmode=require)
      #   CORS_ORIGINS          https://hrms-bay-iota.vercel.app
      #   RESEND_API_KEY        resend.com → API Keys → sending access
      #   WHATSAPP_*            Meta Business → WhatsApp → API Setup
      #   JWT_ACCESS_SECRET     openssl rand -base64 48
      #   JWT_REFRESH_SECRET    openssl rand -base64 48
      #   COOKIE_SECRET         openssl rand -base64 48
      #   SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD
      #   STORAGE_DRIVER=s3, S3_BUCKET, S3_REGION,
      #   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY   (fresh IAM user, not the old keys)
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: STORAGE_DRIVER
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Without this the e-mail channel falls back to SMTP, and with no SMTP
      # host it only LOGS messages and reports them queued — which looks like
      # success and delivers nothing. This is the one value that has to be
      # pasted by hand before invitations work in production.
      - key: RESEND_API_KEY
        sync: false
      # WhatsApp: leave unset until the Meta templates are approved. The channel
      # logs what it would have sent rather than failing, so the app is safe to
      # deploy without them.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
